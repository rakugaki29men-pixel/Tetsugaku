name: 0. Generate Android Keystore (一度だけ実行)

on:
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK (keytoolを使うため)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: ランダムなパスワードとエイリアスを生成
        id: gen
        run: |
          STORE_PASS=$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 24)
          echo "store_pass=$STORE_PASS" >> "$GITHUB_OUTPUT"

      - name: keystoreを生成
        run: |
          keytool -genkeypair -v \
            -storetype PKCS12 \
            -keystore tetsutomo-release.keystore \
            -alias tetsutomo \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ steps.gen.outputs.store_pass }}" \
            -keypass "${{ steps.gen.outputs.store_pass }}" \
            -dname "CN=Tetsutomo, OU=App, O=Tetsutomo, L=Tokyo, ST=Tokyo, C=JP"

      - name: base64化 & 情報ファイル作成
        run: |
          mkdir -p out
          base64 -w0 tetsutomo-release.keystore > out/keystore-base64.txt
          cat > out/keystore-info.txt << EOF
          ▼ このファイルはパスワードマネージャー等、安全な場所に保管してください。
          ▼ 紛失すると、同じ署名で今後のアップデートを出せなくなります(再登録も不可)。
          ▼ PKCS12形式のため、ストアパスワードと鍵パスワードは同じ値になっています。

          KEY_ALIAS       = tetsutomo
          KEYSTORE_PASSWORD (storePassword) = ${{ steps.gen.outputs.store_pass }}
          KEY_PASSWORD (keyPassword)        = ${{ steps.gen.outputs.store_pass }}

          ▼ GitHubのリポジトリ Secrets には以下の4つを登録してください:
            KEYSTORE_BASE64   = keystore-base64.txt の中身(全文)
            KEYSTORE_PASSWORD = ${{ steps.gen.outputs.store_pass }}
            KEY_ALIAS         = tetsutomo
            KEY_PASSWORD      = ${{ steps.gen.outputs.store_pass }}
          EOF

      - name: アーティファクトとしてアップロード
        uses: actions/upload-artifact@v4
        with:
          name: keystore-package
          path: out/
          retention-days: 7
