name: 0. Generate Android Keystore (一度だけ実行)

# パソコンを使わずに、GitHub上だけで署名鍵(keystore)を作るためのワークフロー。
# 「Actions」タブ →「0. Generate Android Keystore」→「Run workflow」ボタンで実行する。
#
# 実行すると:
#   1. ランダムなパスワードを生成
#   2. keytool で keystore ファイルを作成
#   3. keystoreファイル本体(base64テキスト化したもの)とパスワード情報を
#      1つのアーティファクト(zip)にまとめて出力
#
# 実行後にやること:
#   1. 「Actions」タブ → このワークフローの実行結果 → 一番下の
#      「Artifacts」から keystore-package.zip をダウンロード
#   2. 中の keystore-info.txt に書かれたパスワードを、安全な場所に保管
#      (パスワードマネージャー等。これを失うと二度と同じ鍵で更新版を出せなくなる)
#   3. keystore-base64.txt の中身(長い英数字の文字列)を全部コピー
#   4. リポジトリの Settings → Secrets and variables → Actions →
#      New repository secret で以下を登録:
#        - KEYSTORE_BASE64      … keystore-base64.txt の中身
#        - KEYSTORE_PASSWORD    … keystore-info.txt に書かれたストアパスワード
#        - KEY_ALIAS            … keystore-info.txt に書かれたエイリアス名
#        - KEY_PASSWORD         … keystore-info.txt に書かれたキーパスワード
#   5. ダウンロードしたzipはこの手順が終わったらローカルの安全な場所に
#      保管し、GitHub上のワークフロー実行結果(Artifact)は削除してOK
#      (Secretsに登録済みなら、Artifact側は残しておく必要はない)
#
# ⚠ このワークフローは1回だけ実行すればよい。何度も実行すると別の鍵が
#    生成されてしまうので注意。

on:
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK (keytoolを使うため)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: ランダムなパスワードとエイリアスを生成
        id: gen
        run: |
          STORE_PASS=$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 24)
          KEY_PASS=$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 24)
          echo "store_pass=$STORE_PASS" >> "$GITHUB_OUTPUT"
          echo "key_pass=$KEY_PASS" >> "$GITHUB_OUTPUT"

      - name: keystoreを生成
        run: |
          keytool -genkeypair -v \
            -storetype PKCS12 \
            -keystore tetsutomo-release.keystore \
            -alias tetsutomo \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ steps.gen.outputs.store_pass }}" \
            -keypass "${{ steps.gen.outputs.key_pass }}" \
            -dname "CN=Tetsutomo, OU=App, O=Tetsutomo, L=Tokyo, ST=Tokyo, C=JP"

      - name: base64化 & 情報ファイル作成
        run: |
          mkdir -p out
          base64 -w0 tetsutomo-release.keystore > out/keystore-base64.txt
          cat > out/keystore-info.txt << EOF
          ▼ このファイルはパスワードマネージャー等、安全な場所に保管してください。
          ▼ 紛失すると、同じ署名で今後のアップデートを出せなくなります(再登録も不可)。

          KEY_ALIAS       = tetsutomo
          KEYSTORE_PASSWORD (storePassword) = ${{ steps.gen.outputs.store_pass }}
          KEY_PASSWORD (keyPassword)        = ${{ steps.gen.outputs.key_pass }}

          ▼ GitHubのリポジトリ Secrets には以下の4つを登録してください:
            KEYSTORE_BASE64   = keystore-base64.txt の中身(全文)
            KEYSTORE_PASSWORD = ${{ steps.gen.outputs.store_pass }}
            KEY_ALIAS         = tetsutomo
            KEY_PASSWORD      = ${{ steps.gen.outputs.key_pass }}
          EOF

      - name: アーティファクトとしてアップロード
        uses: actions/upload-artifact@v4
        with:
          name: keystore-package
          path: out/
          retention-days: 7
